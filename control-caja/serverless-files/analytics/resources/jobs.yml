Resources:
  TrustedJob:
    Type: AWS::Glue::Job
    Properties:
      Description: Glue job to build control caja Report
      Name: job-analytics-${self:custom.project}-control-caja
      Role: !GetAtt controlCajaJobRole.Arn
      ExecutionProperty:
        MaxConcurrentRuns: 10
      MaxRetries: 0
      NumberOfWorkers: ${self:custom.jobNumberOfWorkers}
      WorkerType: G.1X
      GlueVersion: ${self:custom.glueJobVersion}
      DefaultArguments:
        "--CHRONOS_BUCKET_NAME": ${self:custom.chronosBucketName}
        "--JOB_NAME" : job-analytics-${self:custom.project}-control-caja
        "--PREFIX_DATA" : "${self:custom.prefixData}"
        "--PREFIX_FILE" : "${self:custom.prefixFiles}"
        "--TRUSTED_BUCKET": "${self:custom.dataLakeNameTrusted}"
        "--PROJECT_BUCKET_NAME": ${self:custom.projectBucket}
        '--extra-py-files' : ${self:custom.extraPythonFilesControlCaja}
        "--RTBCOL_DATABASE": "${self:custom.rtbcolDatabase}"
        "--UNITY_DATABASE": "${self:custom.unityDatabase}"
        "--TRM_DATABASE": "${self:custom.trmDatabase}"
        "--DOMINUS_DATABASE": "${self:custom.dominusDatabase}"
        "--MAMBU_CC_DATABASE": "${self:custom.mambuCcDatabase}"
        "--CHECKING_ACCOUNTS_DATABASE": "${self:custom.checkingAccountsDatabase}"
        "--ADAPTER_DATABASE": "${self:custom.adapterDatabase}"
        "--UNITY_OPERATIONS_TABLE": "${self:custom.unityOperationsTable}"
        "--BANK_BALANCES_TABLE": "${self:custom.bankBalancesTable}"
        "--MONEY_MARKET_TABLE": "${self:custom.moneyMarketTable}"
        "--CC_MOVEMENTS_TABLE": "${self:custom.ccMovementsTable}"
        "--MASTER_HOMOLOGATION_TABLE": "${self:custom.masterHomologationTable}"
        "--MULTICASH_MOVEMENTS_TABLE": "${self:custom.multicashMovementsTable}"
        "--UMBRELLA_MASTER_TABLE": "${self:custom.umbrellaMasterTable}"
        "--TRM_TABLE": "${self:custom.trmTable}"
        "--RENEWAL_OPERATIONS_TABLE": "${self:custom.renewalOperationsTable}"
        "--OPERATIONS_A_TABLE": "${self:custom.operationsATable}"
        "--OPERATIONS_B_TABLE": "${self:custom.operationsBTable}"
        "--STANDARDIZED_DERIVATIVES_TABLE": "${self:custom.standardizedDerivativesTable}"
        "--MAMBU_ACCOUNTS_TABLE": "${self:custom.mambuAccountsTable}"
        "--MAMBU_TRANSACTIONS_TABLE": "${self:custom.mambuTransactionsTable}"
        "--MAMBU_CHANNELS_TABLE": "${self:custom.mambuChannelsTable}"
        "--BALANCE_TABLE": "${self:custom.balanceTable}"
        "--DEPOSIT_ACCOUNT_TABLE": "${self:custom.depositAccountTable}"
        "--RECONCILIATION_ADAPTER_TABLE": "${self:custom.reconciliationAdapterTable}"
        "--MARKET_DATABASE": "${self:custom.marketDatabase}"
        "--INCOME_TABLE": "${self:custom.incomeTable}"
        "--EXPENSE_TABLE": "${self:custom.expenseTable}"
        "--AVAILABLE_TABLE": "${self:custom.availableTable}"
        "--SUMMARY_TABLE": "${self:custom.summaryTable}"
        "--TempDir": !Sub "s3://${self:custom.projectBucket}/temp_trusted/"
        "--enable-continuous-cloudwatch-log" : "true"
        "--enable-continuous-log-filter" : "true"
        "--enable-metrics" : "true"
        "--datalake-formats": "iceberg"
        "--additional-python-modules": "openpyxl==3.1.5,pydeequ, holidays-co==1.1.3"
        "--conf": "spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO --conf spark.sql.catalogImplementation=hive --conf hive.metastore.client.factory.class=com.amazonaws.glue.catalog.metastore.AWSGlueDataCatalogHiveClientFactory --conf spark.sql.catalog.awsdatacatalog=org.apache.spark.sql.connector.catalog.hive.HiveCatalog --conf spark.jars.packages=com.amazon.deequ:deequ:2.0.7-spark-3.5"
      Command:
        Name: glueetl
        ScriptLocation: s3://${self:custom.projectBucket}/${self:custom.projectBucketJobsPath}/cash_control.py
